name: Cambios a develop
#Comentario para error
on: 
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch: 
    branches: [develop]

jobs:
  actualizar-README:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Actualizar README.md
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          $readmePath = Join-Path $env:GITHUB_WORKSPACE "README.md"
          $content = Get-Content -Raw -Path $readmePath
          $lineEnding = if ($content.Contains("`r`n")) { "`r`n" } else { "`n" }
          $updatedContent = $content.TrimEnd("`r", "`n") + $lineEnding + "Añadida feature: $env:BRANCH_NAME" + $lineEnding

          [System.IO.File]::WriteAllText(
            $readmePath,
            $updatedContent,
            [System.Text.UTF8Encoding]::new($false)
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: add feature branch to README"
          git push


  validar-secret:
    needs: actualizar-README
    runs-on: self-hosted
    steps:
      - name: Validar secret con variable de entorno
        shell: powershell -ExecutionPolicy Bypass -File {0}
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:DEV_TOKEN)) {
            throw "El secret DEV_TOKEN no está configurado."
          }
          if ([string]::IsNullOrEmpty($env:LOCAL_DEV_TOKEN)) {
            throw "LOCAL_DEV_TOKEN no está disponible en el entorno del proceso del runner."
          }
          if ($env:DEV_TOKEN -ceq $env:LOCAL_DEV_TOKEN) {
            Write-Output "Los tokens coinciden"
          } else {
            Write-Output "Los tokens no coinciden"
          }
